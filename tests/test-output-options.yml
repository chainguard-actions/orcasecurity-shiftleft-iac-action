name: Test output and format options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Valid output folder (ends with /) passes validation; the scan itself is
      # expected to fail authentication with the dummy token.
      - id: action
        uses: .
        continue-on-error: true
        with:
          api_token: dummy-orca-token
          project_key: test-project
          path: tests/fixtures/terraform
          format: sarif
          output: orca-test-results/
          console_output: cli
          exit_code: "3"
          generate_rego_input: orca-test-results/rego-input.json
          display_name: act-harness-scan
          show_annotations: "false"
          disable_err_report: "true"
          silent: "true"
          timeout: 2m
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
          EXIT_CODE: ${{ steps.action.outputs.exit_code }}
        run: |
          echo "outcome: $OUTCOME"
          echo "exit_code: $EXIT_CODE"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$EXIT_CODE" != "0" ]; then
              echo "FAIL: action succeeded but exit_code is '$EXIT_CODE'"
              exit 1
            fi
            echo "PASS: scan succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no valid Orca token in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
