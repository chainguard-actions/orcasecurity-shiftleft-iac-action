name: Test scan with filtering and tuning inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          api_token: dummy-orca-token
          project_key: test-project
          path: tests/fixtures/terraform
          exit_code: "3"
          exclude_paths: tests/fixtures/terraform/ignored
          cloud_provider: aws
          platform: terraform
          exclude_platform: kubernetes
          control_timeout: "30"
          ignore_failed_exec_controls: "true"
          timeout: 5m
          preview_lines: "5"
          max_file_size: "10"
          terraform_vars_path: tests/fixtures/terraform
          no_color: "true"
          disable_err_report: "true"
          show_annotations: "false"
      - name: Assert outcome is consistent with exit_code
        env:
          OUTCOME: ${{ steps.action.outcome }}
          EXIT_CODE: ${{ steps.action.outputs.exit_code }}
        run: |
          echo "outcome: $OUTCOME"
          echo "exit_code: $EXIT_CODE"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$EXIT_CODE" != "0" ]; then
              echo "FAIL: success but exit_code is '$EXIT_CODE'"
              exit 1
            fi
            echo "PASS: scan succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            if [ "$EXIT_CODE" = "0" ]; then
              echo "FAIL: step failed but exit_code output is 0"
              exit 1
            fi
            echo "PASS: scan failed as expected with a dummy Orca token"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
