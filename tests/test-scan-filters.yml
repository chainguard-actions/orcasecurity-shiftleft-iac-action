name: Test scan filter options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # No real Orca API token is available in the harness, so the scan is
      # expected to fail authentication. The test verifies the action accepts
      # the filter inputs and either succeeds or fails gracefully.
      - id: action
        uses: .
        continue-on-error: true
        with:
          api_token: dummy-orca-token
          project_key: test-project
          path: tests/fixtures/terraform
          exclude_paths: tests/fixtures/terraform/excluded
          cloud_provider: aws
          platform: terraform
          exclude_platform: kubernetes
          control_timeout: "30"
          ignore_failed_exec_controls: "true"
          preview_lines: "5"
          max_file_size: "10"
          terraform_vars_path: tests/fixtures/terraform
          show_failed_issues_only: "true"
          include_compressed_files: "false"
          show_annotations: "false"
          disable_err_report: "true"
          no_color: "true"
          timeout: 2m
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
          EXIT_CODE: ${{ steps.action.outputs.exit_code }}
        run: |
          echo "outcome: $OUTCOME"
          echo "exit_code: $EXIT_CODE"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$EXIT_CODE" != "0" ]; then
              echo "FAIL: action succeeded but exit_code is '$EXIT_CODE'"
              exit 1
            fi
            echo "PASS: scan succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no valid Orca token in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
